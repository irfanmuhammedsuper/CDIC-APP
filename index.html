<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hifz Sanad Portal | CDIC</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#3f1d45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CDIC Portal">
<meta name="description" content="Official Hifz Sanad application and candidate services portal of the Coordination of Darussalam Islamic Colleges.">
<link rel="apple-touch-icon" href="https://i.postimg.cc/90QVXGwP/CO-ORDINATION-EMBLUM-FINAL.jpg">
<link rel="icon" href="https://i.postimg.cc/90QVXGwP/CO-ORDINATION-EMBLUM-FINAL.jpg">
<style>
:root{--pur:#3f1d45;--pur2:#5a315f;--grn:#b1812a;--red:#b84550;--gold:#986a1e;--bg:#f7f3ed;--card:#fffdfa;--tx:#2a2430;--mut:#756b78;--bd:#e7dfd4;--r:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,"Noto Sans Malayalam","Nirmala UI","Manjari",sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;font-size:16px;padding-top:79px;padding-bottom:64px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--grn);outline-offset:2px}
.hd{position:fixed;top:0;left:0;right:0;z-index:20;background:#fff;border-bottom:3px solid var(--grn);box-shadow:0 3px 14px #17204412;display:flex;align-items:center;gap:12px;padding:8px 18px;padding-top:calc(8px + env(safe-area-inset-top))}
.hd img{height:54px;width:70px;object-fit:contain;border-radius:7px}
.ttl b{display:block;color:var(--pur);font-size:1.05rem;line-height:1.2;letter-spacing:.035em}.ttl small{color:var(--mut);font-size:.78rem}
.sp{flex:1}
.net{font-size:.75rem;padding:2px 8px;border-radius:20px;background:#e5f5e5;color:#145a14}.net.off{background:#fde2e2;color:#8a0b0b}
.btn{border:0;background:var(--pur);color:#fff;padding:10px 16px;border-radius:var(--r);cursor:pointer;min-height:44px;font-weight:600;transition:background .15s,transform .1s}
.btn:hover{background:var(--pur2)}.btn:active{transform:scale(.98)}
.btn.g{background:var(--grn)}.btn.r{background:var(--red)}.btn.l{background:#fff;color:var(--pur);border:1px solid var(--pur)}.btn.s{min-height:34px;padding:4px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.layout{display:flex;min-height:calc(100vh - 70px)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--bd);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1 0 auto;padding:10px 14px;text-align:center;color:var(--mut);text-decoration:none;font-size:.8rem;cursor:pointer;white-space:nowrap;border-top:3px solid transparent}
nav a:hover{background:#f4f5fa;color:var(--pur)}nav a.on{color:var(--pur);border-top-color:var(--grn);font-weight:700}nav a.dis{opacity:.45;cursor:default}
nav hr{display:none}
main{flex:1;padding:16px;max-width:1200px;margin:0 auto;width:100%;min-width:0}
@media(min-width:860px){body{padding-bottom:0}nav{position:sticky;top:70px;align-self:flex-start;flex-direction:column;width:230px;height:calc(100vh - 70px);border-top:0;border-right:1px solid var(--bd);padding:12px 0;overflow-y:auto}nav a{text-align:left;border-top:0;border-left:4px solid transparent;font-size:.95rem;padding:11px 20px}nav a.on{border-left-color:var(--grn);background:#f1f0f8}nav hr{display:block;width:100%;border:0;border-top:1px solid var(--bd);margin:8px 0}}
.crumb{font-size:.82rem;color:var(--mut);margin-bottom:10px}
h2{margin:.2em 0 .6em;color:var(--pur);letter-spacing:-.02em}h3{color:var(--pur);margin:.2em 0 .5em}h4{margin:.2em 0 .5em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 4px 16px #17204408}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.stat{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--grn);border-radius:var(--r);padding:10px 12px}.stat b{display:block;font-size:1.6rem;color:var(--pur);line-height:1.1}.stat span{font-size:.8rem;color:var(--mut)}
.g2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.bar{display:grid;grid-template-columns:minmax(80px,38%) 1fr 34px;gap:8px;align-items:center;font-size:.82rem;margin:4px 0}.bar i{display:block;height:12px;background:var(--grn);border-radius:6px;min-width:3px}.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar b{text-align:right}
.hero{background:linear-gradient(135deg,#24215a,#3f0b3c);color:#fff;border-radius:var(--r);padding:24px;margin-bottom:16px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 28px #251e5526}
.hero img{width:112px;height:112px;object-fit:contain;flex:0 0 112px;background:#fff;border-radius:14px;padding:8px}.hero h2{color:#fff;margin:0}.hero p{margin:.45em 0}
.ph{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--bd)}.ph:last-child{border:0}.ph em{font-style:normal;background:var(--pur);color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:700}
.ph small{color:var(--mut);display:block}
label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 3px}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=password],input[type=number],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid #c9bfcd;border-radius:8px;background:#fff}
textarea{min-height:90px}
.photo-editor{display:grid;gap:8px;max-width:380px}
.photo-tools{display:grid;gap:8px}
.photo-tools[hidden]{display:none}
.photo-editor input[type=file]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:#fff}
.photo-canvas{display:block;width:min(100%,240px);height:auto;aspect-ratio:3/4;border:1px solid var(--bd);border-radius:8px;background:#eee;touch-action:none;cursor:grab}
.photo-canvas:active{cursor:grabbing}
.photo-zoom{display:flex;align-items:center;gap:10px}
.photo-zoom input{flex:1}
.photo-note{font-size:.82rem;color:var(--mut)}
.rad{display:flex;gap:18px;flex-wrap:wrap}.rad label{display:flex;gap:6px;align-items:center;font-weight:500;margin:4px 0}.rad input{width:20px;height:20px}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--red);background:#fff5f5}.err{color:var(--red);font-size:.82rem;margin-top:2px}
.fld>label{display:flex;align-items:center;justify-content:space-between;gap:8px}
.field-ok{flex:0 0 auto;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#198754;color:#fff;font-size:.8rem;font-weight:800;line-height:1}
.success-check{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:#198754;color:#fff;font-size:2.4rem;font-weight:800;line-height:1}
.sub{border-bottom:1px solid var(--bd);padding-bottom:4px;margin-top:16px}
.cols{display:grid;gap:0 14px;grid-template-columns:1fr}@media(min-width:700px){.cols{grid-template-columns:1fr 1fr}}
.steps{display:flex;gap:4px;margin-bottom:14px}.steps i{flex:1;height:6px;background:var(--bd);border-radius:3px}.steps i.on{background:var(--grn)}
.decl{background:#faf6fb;border-left:4px solid var(--pur);padding:12px;border-radius:6px;text-align:justify;font-size:.95rem}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r);background:#fff;box-shadow:0 4px 16px #17204408}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{background:#f1f0f8;color:var(--pur);cursor:pointer;position:sticky;top:0}tr.cl:hover{background:#f8f8fc;cursor:pointer}
.tag{display:inline-block;padding:1px 9px;border-radius:20px;font-size:.78rem;background:#eee;font-weight:600}
.tag.ok{background:#dff3df;color:#145a14}.tag.no{background:#fde2e2;color:#8a0b0b}.tag.wr{background:#fff0d0;color:#6b4800}.tag.in{background:#e6e8ff;color:#2a2f8a}
.flt{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:10px}.flt>*{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.mut{color:var(--mut)}
.big{font-size:1.5rem;font-weight:800;color:var(--pur);letter-spacing:.5px;word-break:break-all}
.kv{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:4px 10px;font-size:.92rem}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word}
.applicant-profile{display:flex;align-items:center;gap:14px;margin:0 0 12px}
.applicant-avatar{width:76px;height:76px;flex:0 0 76px;object-fit:cover;border:3px solid var(--bd);border-radius:50%;background:#f7f3ed}
.applicant-profile b,.applicant-profile small{display:block}.applicant-profile b{color:var(--pur);font-size:1.05rem}.applicant-profile small{color:var(--mut)}
dialog{border:0;border-radius:14px;padding:0;width:min(780px,96vw);max-height:92vh;box-shadow:0 20px 60px #0005}dialog::backdrop{background:#0007}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--pur);color:#fff;position:sticky;top:0;z-index:2}.dh button{background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer}.db{padding:16px}
#toast{position:fixed;top:78px;right:12px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:92vw}
#toast div{background:#145a14;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 4px 14px #0004;animation:in .2s}#toast .e{background:#8a0b0b}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
#ld{position:fixed;inset:0;background:#fff8;z-index:70;display:none;place-items:center}#ld.on{display:grid}#ld i{width:44px;height:44px;border:5px solid var(--bd);border-top-color:var(--pur);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.ban{background:#fff7e6;border:1px solid #e6c36a;padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:.9rem}
nav .nav-credit{display:none}
#print{display:none}
@media(max-width:520px){.hd{gap:8px;padding-left:10px;padding-right:10px}.hd img{width:56px;height:46px}.ttl b{font-size:.9rem}.ttl small{font-size:.7rem}.hero{padding:18px}.hero img{width:84px;height:84px;flex-basis:84px}.card{padding:14px}}
@media(min-width:860px){nav .nav-credit{position:absolute;right:0;bottom:12px;left:0;display:block;padding:12px 20px 4px;color:var(--mut);font-size:.72rem;opacity:.7;text-decoration:none}nav .nav-credit:hover{color:var(--pur);opacity:1;text-decoration:underline}}
@page{size:A4 portrait;margin:5mm}
@media print{
  body{margin:0;padding:0;background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block!important;width:100%;max-width:100%;margin:0;padding:0;color:#000;font-size:9pt;line-height:1.18;overflow-wrap:anywhere}
  #print *{box-sizing:border-box}
  #print .print-application{zoom:.95}
  #print .print-header{max-width:100%;padding-bottom:1.5mm;border-bottom:1.5pt solid #bd3342}
  #print .print-contact{display:grid;grid-template-columns:1fr 18mm 1fr;gap:2mm;align-items:center;font-size:7pt;line-height:1.2}
  #print .print-contact img{width:17mm!important;height:17mm!important;max-width:17mm!important;object-fit:contain}
  #print .print-contact-right{text-align:right}
  #print .print-arabic{text-align:center;font-size:12pt;font-weight:700;line-height:1.2}
  #print .print-org{text-align:center;font-size:11pt;font-weight:800;line-height:1.2}
  #print .print-address{text-align:center;font-size:6.5pt;font-weight:700;line-height:1.2}
  #print .print-title{margin:1.5mm 0;color:#000;text-align:center;font-size:10pt}
  #print .print-number{display:flex;justify-content:space-between;align-items:center;border:1pt solid #000;padding:1.5mm 2mm;font-weight:700}
  #print .print-number strong{font-size:10pt;letter-spacing:.04em}
  #print h3{margin:.8mm 0 .5mm;padding:.5mm 1.5mm;border:1pt solid #000;background:#eee;font-size:8.8pt;break-after:avoid-page}
  #print p{margin:.5mm 0;overflow-wrap:anywhere;font-size:8pt;line-height:1.1}
  #print .kv{display:grid;grid-template-columns:minmax(20mm,22%) minmax(0,1fr) minmax(20mm,22%) minmax(0,1fr);gap:0 1mm;margin:0;font-size:7.8pt}
  #print .kv dt,#print .kv dd{min-width:0;padding:.35mm .5mm;border-bottom:.5pt solid #999;overflow-wrap:anywhere;break-inside:avoid}
  #print .kv small{font-size:6.5pt}
  #print .print-section{margin-top:.7mm}
  #print .print-personal{display:grid;grid-template-columns:minmax(0,1fr) 24mm;gap:1.2mm;align-items:start}
  #print .print-identity{grid-template-columns:minmax(18mm,25%) minmax(0,1fr) minmax(18mm,25%) minmax(0,1fr)}
  #print .print-photo{display:block;width:24mm;height:32mm;object-fit:cover;border:1pt solid #000}
  #print .pb{border:1pt solid #000;padding:.8mm 1.2mm;margin-top:.8mm}
  #print .office-use h3{margin:0 0 1mm}
  #print .print-signature{margin-top:1mm!important;text-align:right}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Modern visual system */
:root{
  --ease:cubic-bezier(.2,.8,.2,1);
  --pur:#3f1d45;
  --pur2:#5a315f;
  --grn:#b1812a;
  --grn2:#d2ae66;
  --red:#b84550;
  --gold:#986a1e;
  --bg:#f7f3ed;
  --card:#fffdfa;
  --tx:#2a2430;
  --mut:#756b78;
  --bd:#e7dfd4;
  --r:18px;
  --shadow-sm:0 6px 18px rgba(63,29,69,.07);
  --shadow-md:0 16px 40px rgba(63,29,69,.13);
}
body{
  background:
    radial-gradient(circle at 8% 4%,rgba(90,49,95,.07),transparent 22rem),
    radial-gradient(circle at 92% 12%,rgba(210,174,102,.10),transparent 18rem),
    var(--bg);
  letter-spacing:.01em;
}
.hd{
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(221,229,223,.9);
  box-shadow:0 8px 30px rgba(63,29,69,.07);
  padding:10px 20px;
}
.hd img{
  width:58px;
  height:58px;
  object-fit:cover;
  border-radius:50%;
  border:3px solid #fff;
  background:#fff;
  box-shadow:0 5px 16px rgba(63,29,69,.14);
}
.ttl b{color:var(--pur);font-size:1.08rem}
.ttl small{color:var(--mut)}
.net{
  border:1px solid #ccebd8;
  background:#ecf8f1;
  color:#16623d;
  padding:5px 10px;
  font-weight:700;
  box-shadow:none;
}
.net.off{border-color:#f1c5c9;background:#fff0f1;color:#9d2631}
.btn{
  min-height:42px;
  border-radius:12px;
  background:var(--pur);
  box-shadow:0 7px 16px rgba(63,29,69,.12);
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
}
.btn:hover{
  background:var(--pur2);
  transform:translateY(-2px);
  box-shadow:0 10px 22px rgba(63,29,69,.16);
}
.btn:active{transform:translateY(0) scale(.98)}
.btn.g{color:#302037;background:linear-gradient(135deg,var(--grn),var(--grn2));box-shadow:0 8px 18px rgba(152,106,30,.22)}
.btn.g:hover{color:#26172d;background:linear-gradient(135deg,#c59b4f,#dfc27e)}
.btn.r{background:var(--red)}
.btn.l{
  background:rgba(255,255,255,.82);
  color:var(--pur);
  border:1px solid var(--bd);
  box-shadow:0 4px 12px rgba(63,29,69,.05);
}
.btn.l:hover{border-color:#b9cbbf;background:#fff}
.btn.s{min-height:36px;border-radius:10px}
nav{
  background:rgba(255,255,255,.94);
  border-top:1px solid var(--bd);
  box-shadow:0 -8px 28px rgba(63,29,69,.07);
}
nav a{
  position:relative;
  border-radius:10px;
  margin:4px 5px;
  padding:11px 10px;
  transition:color .18s ease,background .18s ease,transform .18s ease;
}
nav a:hover{transform:translateY(-1px)}
nav a.on{
  color:var(--pur);
  background:linear-gradient(135deg,#f8f1e5,#fffaf1);
  border-top-color:transparent;
  box-shadow:inset 0 0 0 1px rgba(152,106,30,.14);
}
nav a.on::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:3px;
  width:18px;
  height:3px;
  border-radius:3px;
  transform:translateX(-50%);
  background:var(--gold);
}
main{padding:22px}
.crumb{
  display:inline-flex;
  align-items:center;
  min-height:28px;
  margin-bottom:12px;
  padding:4px 10px;
  border:1px solid var(--bd);
  border-radius:999px;
  background:rgba(255,255,255,.7);
  color:var(--mut);
  font-size:.76rem;
  font-weight:700;
  animation:fadeDown .35s ease both;
}
h2,h3,h4{color:var(--pur)}
h2{font-size:clamp(1.45rem,2vw,2rem)}
.card{
  border:1px solid rgba(221,229,223,.95);
  border-radius:var(--r);
  box-shadow:var(--shadow-sm);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.card:hover{
  border-color:#d1ded5;
  box-shadow:var(--shadow-md);
}
.hero{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;
  background:
    radial-gradient(circle at 82% 20%,rgba(210,174,102,.28),transparent 15rem),
    linear-gradient(135deg,#35183c 0%,#552a5a 62%,#77552c 135%);
  box-shadow:0 18px 38px rgba(63,29,69,.18);
  animation:fadeUp .48s ease both;
}
.hero::after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  right:-110px;
  bottom:-140px;
  border:24px solid rgba(255,255,255,.05);
  border-radius:50%;
}
.hero img{
  width:118px;
  height:118px;
  border-radius:22px;
  border:5px solid rgba(255,255,255,.9);
  box-shadow:0 14px 28px rgba(0,0,0,.18);
}
.hero h2{font-size:clamp(1.55rem,3vw,2.2rem)}
.stat{
  border:1px solid var(--bd);
  border-left:0;
  border-radius:15px;
  background:linear-gradient(145deg,#fff,#fbfdfc);
  box-shadow:var(--shadow-sm);
  transition:transform .2s ease,box-shadow .2s ease;
}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.stat b{color:var(--pur)}
.stat span{color:var(--mut);font-weight:700}
.ph{
  margin:5px 0;
  padding:13px 10px;
  border:1px solid transparent;
  border-radius:12px;
  transition:background .18s ease,border-color .18s ease,transform .18s ease;
}
.ph:hover{background:#fbf7f0;border-color:var(--bd);transform:translateX(3px)}
.ph em{
  color:#302037;
  background:linear-gradient(135deg,var(--grn),var(--grn2));
  box-shadow:0 7px 14px rgba(152,106,30,.20);
}
label{color:var(--pur);margin:12px 0 5px}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=password],input[type=number],select,textarea{
  min-height:48px;
  border:1px solid #ccd6cf;
  border-radius:12px;
  background:#fff;
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
input:focus,select:focus,textarea:focus{
  outline:0;
  border-color:var(--gold);
  box-shadow:0 0 0 4px rgba(152,106,30,.13);
  background:#fff;
}
.fld.bad input,.fld.bad select,.fld.bad textarea{
  border-color:var(--red);
  box-shadow:0 0 0 4px rgba(216,74,85,.08);
}
.steps i{height:7px;border-radius:999px;transition:flex .25s ease,background .25s ease}
.steps i.on{background:linear-gradient(90deg,var(--gold),var(--grn2))}
.decl{
  background:linear-gradient(135deg,#fbf7f0,#f6efe3);
  border-left:4px solid var(--pur);
  border-radius:12px;
  border:1px solid var(--bd);
}
.tw{
  border:1px solid var(--bd);
  border-radius:16px;
  box-shadow:var(--shadow-sm);
}
th{
  background:#edf3ef;
  color:var(--pur);
  border-bottom:1px solid #d9e3dc;
  font-size:.82rem;
  text-transform:none;
  letter-spacing:.02em;
}
td{border-bottom:1px solid #edf0ed}
tr.cl{transition:background .15s ease,transform .15s ease}
tr.cl:hover{background:#fbf7f0}
.tag{padding:3px 10px;border-radius:999px}

    p=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/);d=+p[1];m=+p[2];y=+p[3];
  }else return '';
  if(y<1000||m<1||m>12||d<1||d>31)return '';
  const dt=new Date(Date.UTC(y,m-1,d));
  if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d)return '';
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
};

};

function toast(m,e){const d=document.createElement('div');if(e)d.className='e';d.textContent=e?m:`✓ ${m}`;$('#toast').appendChild(d);setTimeout(()=>d.remove(),e?6000:3500)}
const load=on=>$('#ld').classList.toggle('on',!!on);
function modal(title,html){const d=$('#dlg');d.innerHTML=`<div class="dh"><b>${esc(title)}</b><button aria-label="Close" onclick="$('#dlg').close()">×</button></div><div class="db">${html}</div>`;if(!d.open)d.showModal();return d}
function successPopup(message){const d=modal(b('വിജയം','Success'),`<div style="text-align:center"><span class=success-check role=img aria-label="${b('വിജയകരമായി പൂർത്തിയായി','Completed successfully')}">✓</span><p>${esc(message)}</p><button class="btn g" id=successClose>${b('ശരി','OK')}</button></div>`);$('#successClose').onclick=()=>d.close()}
function confirmBox(msg){return new Promise(r=>{const d=modal(b('സ്ഥിരീകരണം','Confirm'),`<p>${esc(msg)}</p><div class=row><button class="btn g" id=cy>${b('അതെ, തുടരുക','Yes, continue')}</button><button class="btn l" id=cn>${t('cancel')}</button></div>`);$('#cy').onclick=()=>{d.close();r(true)};$('#cn').onclick=()=>{d.close();r(false)};d.onclose=()=>r(false)})}
async function run(fn){load(1);try{return await fn()}catch(e){toast(e.net?b('ഇന്റർനെറ്റ്/സെർവർ ബന്ധം ലഭ്യമല്ല','Network or server unavailable'):e.message,1)}finally{load(0)}}
async function api(action,data,rid){
  if(API_URL.indexOf('YOUR_')===0){const e=new Error('API_URL not configured in CDIC.HTML');throw e}
  let r;try{r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:S.token,requestId:rid||uid(),data:data||{}})});}catch(x){const e=new Error('network');e.net=1;throw e}
  let j;try{j=await r.json()}catch(x){const e=new Error('Bad server response');e.net=1;throw e}
  if(!j.success){if(j.error&&j.error.code==='AUTH_REQUIRED'&&S.token){clearSess();go('login')}const e=new Error(j.message);e.res=j;throw e}
  const result=j.data||{},warnings=[...(result.notificationWarning?[result.notificationWarning]:[]),...(result.notificationWarnings||[])];
  if(warnings.length)toast(warnings.length===1?w:`${warnings.length} applicant email notifications could not be sent.`,1);
  return j.data}

function clearSess(){S.token='';S.user=null;sessionStorage.removeItem('tk');sessionStorage.removeItem('us')}

function resetPhotoEditor(){

function drawPhotoCrop(commit){

  const tools=$('#photoTools');if(tools)tools.hidden=!PHOTO.image;

  const dw=image.naturalWidth*scale,dh=image.naturalHeight*scale;
  PHOTO.x=Math.max(w-dw,Math.min(0,PHOTO.x));PHOTO.y=Math.max(h-dh,Math.min(0,PHOTO.y));
  ctx.drawImage(image,(w-dw)/2+PHOTO.x,(h-dh)/2+PHOTO.y,dw,dh);

    const data=canvas.toDataURL('image/jpeg',.78);
    if(data.length>550000){toast(b('ഫോട്ടോ വളരെ വലുതാണ്; ചെറിയ ചിത്രം തിരഞ്ഞെടുക്കുക.','Photo is too large; choose a smaller image.'),1);return}
    FD.photoData=data;saveDraft();ERRS.photo='';const field=$('#photo-field');if(field){field.classList.remove('bad');field.querySelector('.err')?.remove()}syncPhotoMark();
  }
}

function fieldHasValue(field){
  const radios=[...field.querySelectorAll('input[type=radio]')];
  if(radios.length)return radios.some(el=>el.checked);
  const checks=[...field.querySelectorAll('input[type=checkbox]')];
  if(checks.length)return checks.some(el=>el.checked);
  return [...field.querySelectorAll('input,select,textarea')].some(el=>String(el.value||'').trim()!=='');
}
function syncFieldMark(el){

function stp(d){

    if(el.type==='checkbox')FD[el.name]=el.checked;
    else if(el.type==='radio'){if(el.checked)FD[el.name]=el.value}

    else FD[el.name]=el.value;
  });
  if(d>0&&step<4){const e=vErr(FD),ks=stepKeys(step);ERRS={};ks.forEach(k=>{if(e[k]&&!(k==='tharqiyyaYear'&&FD.tharqiyya!=='Yes'))ERRS[k]=e[k]});if(Object.keys(ERRS).length){vApply();toast(b('ചുവപ്പ് അടയാളമിട്ട വിവരങ്ങൾ ശരിയാക്കുക','Please correct the highlighted fields'),1);return}}

}
async function submitApp(){
  const dobInput=document.querySelector('#v [name="dob"]');

  document.querySelectorAll('#v [name]').forEach(el=>{
    if(el.type==='checkbox')FD[el.name]=el.checked;
    else if(el.type==='radio'){if(el.checked)FD[el.name]=el.value}
    else if(el.name==='dob')FD.dob=normalizeDate(el.value)||el.value;
    else if(el.type==='date')FD[el.name]=normalizeDate(el.value)||el.value;
    else FD[el.name]=el.value;
  });
  if(FD.dob)FD.dob=normalizeDate(FD.dob)||FD.dob;
  if(FD.declDate)FD.declDate=normalizeDate(FD.declDate)||FD.declDate;
  const e=vErr(FD);if(Object.keys(e).length){ERRS=e;for(let i=0;i<4;i++)if(stepKeys(i).some(k=>e[k])){step=i;break}vApply();toast(b('ചില വിവരങ്ങൾ ശരിയല്ല','Some fields need correction'),1);return}

  FD._rid=FD._rid||uid();saveDraft();  const form={...FD,dob:normalizeDate(FD.dob),declDate:normalizeDate(FD.declDate)};delete form._rid;
  await run(async()=>{try{const r=await api('submitApplication',{form},FD._rid);LS.d('cdic_draft');done(r.applicationNo,form);FD={};resetPhotoEditor();step=0}
   catch(x){if(x.net){const q=LS.g('cdic_q',[]);q.push({rid:FD._rid,form});LS.s('cdic_q',q);LS.d('cdic_draft');FD={};resetPhotoEditor();step=0;toast(b('ഓഫ്‌ലൈൻ ആണ്; ഇന്റർനെറ്റ് വരുമ്പോൾ സ്വയം സമർപ്പിക്കും.','Offline: will be submitted automatically when online.'));go('home')}
   else{if(x.res&&x.res.error&&x.res.error.details){ERRS=x.res.error.details;for(let i=0;i<4;i++)if(stepKeys(i).some(k=>ERRS[k])){step=i;break}vApply()}throw x}}})}

async function releaseResultDrafts(){
  const d=await run(()=>api('getResultDrafts'));if(!d)return;
  const draftCount=d.rows.length,publishedRows=d.publishedRows||[],hiddenCount=d.publicEnabled?0:publishedRows.length;
  if(!draftCount&&!hiddenCount)return toast(b('പ്രസിദ്ധീകരിക്കാൻ ഫലങ്ങളില്ല','There are no results to release'),1);
  const qualified=d.rows.filter(r=>r.resultStatus==='Qualified').length,notQualified=d.rows.length-qualified;
  const publishedQualified=publishedRows.filter(r=>r.resultStatus==='Qualified').length,publishedNotQualified=publishedRows.length-publishedQualified;
  const releaseQualified=qualified+(d.publicEnabled?0:publishedQualified),releaseNotQualified=notQualified+(d.publicEnabled?0:publishedNotQualified);
  const releaseCount=draftCount+hiddenCount;
  const msg=b(`${releaseCount} ഫലങ്ങൾ പൊതുജനങ്ങൾക്ക് ലഭ്യമാകും (${releaseQualified} യോഗ്യത നേടി, ${releaseNotQualified} യോഗ്യത നേടിയില്ല). തുടരട്ടേ?`,
    `${releaseCount} results will become publicly visible (${releaseQualified} Qualified, ${releaseNotQualified} Not Qualified). Continue?`);
  if(!await confirmBox(msg))return;
  await run(async()=>{
    let updated=0,q=0,nq=0,res;
    do{res=await api('publishResultDrafts',{});updated+=res.updated;q+=res.qualified;nq+=res.notQualified;if(res.remaining&&res.updated===0)throw new Error('Result release stopped with drafts remaining. Retry after refreshing.')}while(res.remaining);
    if(!res.publicEnabled)throw new Error('Result drafts were processed but public visibility could not be enabled.');
    const released=updated+hiddenCount;
    toast(released?`${released} ${b('ഫലങ്ങൾ പൊതുജനങ്ങൾക്ക് ലഭ്യമാക്കി','results now visible publicly')} · ${q+(d.publicEnabled?0:publishedQualified)} ${b('യോഗ്യത നേടി','Qualified')} · ${nq+(d.publicEnabled?0:publishedNotQualified)} ${b('യോഗ്യത നേടിയില്ല','Not Qualified')}`:b('ഫലങ്ങൾ ഇതിനകം പൊതുജനങ്ങൾക്ക് ലഭ്യമാണ്','Results are already visible publicly'));
    await go('results');
  });
}

(function(){
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const hd=document.querySelector('.hd');
  const main=document.getElementById('main');
  const counted=new WeakSet();

  addEventListener('scroll',()=>hd.classList.toggle('sc',scrollY>24),{passive:true});

  document.addEventListener('pointerdown',e=>{
    const target=e.target instanceof Element?e.target:null;
    const btn=target&&target.closest('.btn');
    if(!btn||btn.disabled||reduce)return;
    const rect=btn.getBoundingClientRect(),size=Math.max(rect.width,rect.height),rp=document.createElement('span');
    rp.className='rp';
    rp.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
    btn.appendChild(rp);
    setTimeout(()=>rp.remove(),650);
  });

  function countUp(el){
    const end=parseInt(el.textContent.replace(/,/g,''),10);
    if(isNaN(end)||end===0||reduce||counted.has(el))return;
    counted.add(el);
    const start=performance.now(),duration=900;
    (function frame(now){
      const progress=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-progress,4);
      el.textContent=Math.round(end*ease);
      if(progress<1)requestAnimationFrame(frame);
    })(start);
  }

  function confetti(){
    if(reduce||document.querySelector('.confetti-layer'))return;
    const colors=['#51245a','#77447e','#986a1e','#d2ae66','#3f1d45','#fffdfa'];
    const layer=document.createElement('div');
    layer.className='confetti-layer';
    layer.setAttribute('aria-hidden','true');
    for(let i=0;i<48;i++){
      const piece=document.createElement('i');
      piece.className='cf';
      piece.style.cssText=`left:${Math.random()*100}%;background:${colors[i%colors.length]};--dx:${(Math.random()-.5)*180}px;--rot:${Math.random()*900-450}deg;animation-delay:${Math.random()*.35}s;animation-duration:${1.8+Math.random()*1.2}s`;
      layer.appendChild(piece);
    }
    document.body.appendChild(layer);
    setTimeout(()=>layer.remove(),3600);
  }

  new MutationObserver(records=>{
    records.forEach(record=>record.addedNodes.forEach(node=>{
      if(node.nodeType!==1)return;
      if(node.matches('.big')||node.querySelector('.big'))confetti();
      const cards=node.matches('.grid > .stat')?[node]:[...node.querySelectorAll('.grid > .stat')];
      cards.forEach((card,index)=>{
        card.style.animation=`rise .6s var(--ease) ${index*60}ms both`;
        const value=card.querySelector('b');
        if(value)countUp(value);
      });
    }));
  }).observe(main,{childList:true,subtree:true});
})();
